# dsh-cost-chip patch row: the plugin entry users insert into a profile.
#
# This package is a PLAIN plugin (not a `dsh.bundle` layer), so the row goes
# into the profile's user patch file — `$DSH_HOME/profiles/<name>/cordis.patch.yml`
# — or any `--patch` overlay:
#
#   - insert:
#       - id: command-cost
#         name: 'dsh-cost-chip'
#         config: {}            # optional; see README for keys
#
# The `name` is the npm package itself; the loader resolves it from the
# profile's node_modules (install with `dsh plugin --profile <name> add <pkg>`
# or the profile's own package manager). On web profiles the package's
# `dsh.client` half is picked up automatically: the client renders a floating
# cost chip and polls the `/cost-panel/data` route the plugin registers.

- insert:
    - id: command-cost
      name: 'dsh-cost-chip'
      # config:
      #   timeZone: 'Asia/Shanghai'
      #   peakRanges: [[9, 12], [14, 18]]
