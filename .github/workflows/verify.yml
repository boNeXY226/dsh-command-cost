name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Offline verification (real cordis + loader + commands + React SSR)
        run: npm run verify
        env:
          # The verify harness imports cordis/loader/commands/react from a dsh
          # installation; the devDependency install provides one at ./node_modules.
          DSH_INSTALL: ${{ github.workspace }}/node_modules
