<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 模拟深色主题页面背景 -->
  <rect width="720" height="720" fill="#0e0f12"/>
  <rect width="718" height="718" x="1" y="1" fill="none" stroke="#2a2b30" stroke-width="2"/>
  <!-- 费用胶囊（与 client.js 的 chipStyle 一致：bg #18181b、border #3f3f46、圆角 14） -->
  <rect x="70" y="566" width="430" height="78" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1" filter="url(#shadow)"/>
  <!-- 第一行：模型 -->
  <text x="90" y="594" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">deepseek-official · deepseek-v4-pro</text>
  <!-- 第二行：时段 · token · 金额 · 刷新 -->
  <text x="90" y="618" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#f4f4f5">🟢 空闲时段</text>
  <text x="180" y="618" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#a1a1aa">34.5M tok</text>
  <text x="260" y="618" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#60a5fa">¥2.5111</text>
  <text x="350" y="618" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#a1a1aa">↻</text>
  <!-- 底部说明 -->
  <text x="70" y="700" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#5b5c63">floating chip · bottom-left of the conversation · auto-refresh every 5s</text>
</svg>
